name: Fix passkey menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-passkey-menu.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch menu integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('dialoge.js'); s=p.read_text(encoding='utf-8')
          old="""  function addLockMenuItem() {\n    var box = document.getElementById('nav-menu');\n    if (!box || box.querySelector('[data-ka-lock]')) return;\n    var ver = box.querySelector('.nav-ver');\n    var h = document.createElement('div'); h.className = 'nav-group'; h.textContent = 'Sicherheit'; h.setAttribute('data-ka-lock', '1');\n"""
          new="""  function addLockMenuItem() {\n    var box = document.getElementById('nav-menu');\n    if (!box || box.querySelector('[data-ka-security-root]')) return;\n    var ver = box.querySelector('.nav-ver');\n    var h = document.createElement('div'); h.className = 'nav-group'; h.textContent = 'Sicherheit'; h.setAttribute('data-ka-lock', '1'); h.setAttribute('data-ka-security-root', '1');\n"""
          if old not in s: raise SystemExit('addLockMenuItem-Anker fehlt')
          s=s.replace(old,new,1)
          old="""  document.addEventListener('DOMContentLoaded', function () {\n    lockUiInit();\n    setTimeout(lockUiInit, 1000);\n  });\n  document.addEventListener('click', function (ev) {\n    var t = ev.target && ev.target.closest ? ev.target.closest('#btn-praxis') : null;\n    if (t) setTimeout(addLockMenuItem, 0);\n  });\n"""
          new="""  function watchSecurityMenu() {\n    var box = document.getElementById('nav-menu');\n    if (!box) return;\n    addLockMenuItem();\n    if (!box._kaSecurityObserver && window.MutationObserver) {\n      var ob = new MutationObserver(function () {\n        if (!box.querySelector('[data-ka-security-root]')) setTimeout(addLockMenuItem, 0);\n      });\n      ob.observe(box, { childList: true });\n      box._kaSecurityObserver = ob;\n    }\n  }\n\n  document.addEventListener('DOMContentLoaded', function () {\n    lockUiInit();\n    setTimeout(lockUiInit, 1000);\n    setTimeout(watchSecurityMenu, 0);\n  });\n"""
          if old not in s: raise SystemExit('alter Menü-Trigger fehlt')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/browser-smoke.mjs'); s=p.read_text(encoding='utf-8')
          old="""    fillNavMenu();\n    const menuText = document.getElementById('nav-menu').innerText;\n    out.menuGroups = ['Finanzen','Praxis','Kommunikation & Vorlagen','Daten & Technik','Geplant']\n      .every(t => menuText.includes(t));\n"""
          new="""    fillNavMenu();\n    await new Promise(resolve => setTimeout(resolve, 0));\n    const menuText = document.getElementById('nav-menu').innerText;\n    out.menuGroups = ['Finanzen','Praxis','Kommunikation & Vorlagen','Daten & Technik','Geplant','Sicherheit']\n      .every(t => menuText.includes(t));\n    out.securityMenu = menuText.includes('Passkey einrichten') && menuText.includes('App sperren');\n"""
          if old not in s: raise SystemExit('Browser-Menütest-Anker fehlt')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/static-check.mjs'); s=p.read_text(encoding='utf-8')
          marker="assert.ok(!html.includes('>Verschlüsselung aufheben</button>'), 'Verschlüsselung darf nicht deaktivierbar sein');\n"
          add="""assert.ok(!html.includes('>Verschlüsselung aufheben</button>'), 'Verschlüsselung darf nicht deaktivierbar sein');\nconst dialoge = read('dialoge.js');\nfor (const marker of ['Passkey einrichten', 'data-ka-security-root', 'MutationObserver', 'watchSecurityMenu']) {\n  assert.ok(dialoge.includes(marker), `Passkey-Menü-Invariante fehlt: ${marker}`);\n}\n"""
          if marker not in s: raise SystemExit('Static-Test-Anker fehlt')
          s=s.replace(marker,add,1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if "var KA_V = '2026-11-01-t';" not in s: raise SystemExit('App-Version t fehlt')
          p.write_text(s.replace("var KA_V = '2026-11-01-t';","var KA_V = '2026-11-01-u';",1),encoding='utf-8')
          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          if "var V='2026-11-01-t'" not in s: raise SystemExit('SW-Version t fehlt')
          p.write_text(s.replace("var V='2026-11-01-t'","var V='2026-11-01-u'",1),encoding='utf-8')
          PY
      - name: Static regression checks
        run: npm run test:static
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dialoge.js tests/browser-smoke.mjs tests/static-check.mjs index.html sw.js
          git commit -m 'Passkey-Menü auf mobilen Geräten zuverlässig anzeigen'
          git push
