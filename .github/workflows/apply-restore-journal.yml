name: Apply restore journal

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-restore-journal.py'
      - '.github/workflows/apply-restore-journal.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply restore journal patch
        run: python3 tools/apply-restore-journal.py
      - name: Static regression checks
        run: npm run test:static
      - name: Install pinned browser test dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ka-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ka-http.log
          exit 1
      - name: Browser smoke checks
        run: npm run test:browser
      - name: Commit restore journal
        run: |
          if git diff --quiet -- index.html sw.js tests/static-check.mjs tests/browser-smoke.mjs; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js tests/static-check.mjs tests/browser-smoke.mjs
          git commit -m 'Restore mit Journal und Rollback absichern'
          git push
