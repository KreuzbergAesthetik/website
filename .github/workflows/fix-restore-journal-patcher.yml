name: Fix restore journal patcher

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix-restore-journal-patcher.py'
      - '.github/workflows/fix-restore-journal-patcher.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix patcher
        run: python3 tools/fix-restore-journal-patcher.py
      - name: Commit patcher fix
        run: |
          if git diff --quiet -- tools/apply-restore-journal.py; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/apply-restore-journal.py
          git commit -m 'Restore-Journal Patcher korrigieren'
          git push
