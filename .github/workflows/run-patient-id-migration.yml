name: Run patient ID migration

on:
  push:
    branches: [main]
    paths:
      - '.patient-id-migration-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed migration
        shell: bash
        run: |
          set -euo pipefail
          echo "source=$(git hash-object index.html)"
          test "$(git hash-object index.html)" = "030f4567f88ec38294782cc6b09284380e4ce572"
          awk '/^[[:space:]]*H4sI/{gsub(/^[[:space:]]+/,""); print; exit}' .github/workflows/apply-patient-id-migration.yml > /tmp/patient-id.patch.gz.b64
          base64 -d /tmp/patient-id.patch.gz.b64 | gzip -dc > /tmp/patient-id.patch
          echo "patch=$(sha256sum /tmp/patient-id.patch | cut -d' ' -f1) bytes=$(wc -c < /tmp/patient-id.patch)"
          test "$(sha256sum /tmp/patient-id.patch | cut -d' ' -f1)" = "481d62a83b811c96732d117b9400a5c34d5af0b26c679cd4b1c2ec3e351f854e"
          git apply --check /tmp/patient-id.patch
          git apply /tmp/patient-id.patch
          echo "target=$(git hash-object index.html)"
          test "$(git hash-object index.html)" = "6d8859beb0b3b38f0ac5b165f76043b51c7e1427"
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n;\n'.join(blocks))
          sw = Path('sw.js')
          t = sw.read_text()
          old = "var V='2026-11-01-f'"
          new = "var V='2026-11-01-g'"
          if t.count(old) != 1:
              raise SystemExit('Unexpected service-worker version')
          sw.write_text(t.replace(old, new, 1))
          PY
          node --check /tmp/index-inline.js
          git diff --check
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Patiententermine auf interne IDs umstellen'
          git push origin HEAD:main
