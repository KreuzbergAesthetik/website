name: Auto passkey unlock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-passkey-unlock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Automatischen Passkey-Start einbauen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('dialoge.js'); s=p.read_text(encoding='utf-8')
          old="""      extensions: { prf: { evalByCredential: by } }\n    } });\n"""
          new="""      extensions: { prf: { evalByCredential: by } }\n    }, mediation: 'required' });\n"""
          if old not in s: raise SystemExit('Passkey-get-Anker fehlt')
          s=s.replace(old,new,1)

          anchor="""  function pkPatchPasswordChange() {\n"""
          block="""  var pkAutoBusy = false, pkAutoAttempted = false, pkAutoWasLocked = false;\n  function pkMaybeAutoUnlock() {\n    var locked = document.documentElement.classList.contains('locked');\n    if (!locked) { pkAutoWasLocked = false; pkAutoAttempted = false; return; }\n    if (!pkAutoWasLocked) { pkAutoWasLocked = true; pkAutoAttempted = false; }\n    if (pkAutoBusy || pkAutoAttempted || document.visibilityState === 'hidden') return;\n    var c = typeof window.alGet === 'function' ? window.alGet() : null;\n    if (!c || !c.pk || !pkSupported()) return;\n    pkAutoAttempted = true; pkAutoBusy = true;\n    setTimeout(function () {\n      Promise.resolve(window.pkUnlock ? window.pkUnlock() : pkUnlock()).catch(function () {}).finally(function () { pkAutoBusy = false; });\n    }, 60);\n  }\n  function pkWatchLockScreen() {\n    var root = document.documentElement;\n    if (!root._kaPkLockObserver && window.MutationObserver) {\n      var ob = new MutationObserver(function () { pkMaybeAutoUnlock(); });\n      ob.observe(root, { attributes: true, attributeFilter: ['class'] });\n      root._kaPkLockObserver = ob;\n    }\n    if (!document._kaPkVisibilityBound) {\n      document.addEventListener('visibilitychange', function () { if (document.visibilityState !== 'hidden') pkMaybeAutoUnlock(); });\n      document._kaPkVisibilityBound = true;\n    }\n    pkMaybeAutoUnlock();\n  }\n\n  function pkPatchPasswordChange() {\n"""
          if anchor not in s: raise SystemExit('Passkey-Auto-Anker fehlt')
          s=s.replace(anchor,block,1)

          old="""      pkPatchPasswordChange(); pkRefreshUnlockButton();\n"""
          new="""      pkPatchPasswordChange(); pkRefreshUnlockButton(); pkWatchLockScreen();\n"""
          if old not in s: raise SystemExit('lockUiInit-Anker fehlt')
          s=s.replace(old,new,1)

          old="""  window.pkSetup = pkSetup;\n  window.pkUnlock = pkUnlock;\n"""
          new="""  window.pkSetup = pkSetup;\n  window.pkUnlock = pkUnlock;\n  window.pkMaybeAutoUnlock = pkMaybeAutoUnlock;\n"""
          if old not in s: raise SystemExit('Passkey-Export-Anker fehlt')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/static-check.mjs'); s=p.read_text(encoding='utf-8')
          old="""  'Dein Passwort bleibt als Rückfall erhalten'\n]) {\n"""
          new="""  'Dein Passwort bleibt als Rückfall erhalten',\n  \"mediation: 'required'\",\n  'function pkMaybeAutoUnlock()',\n  'function pkWatchLockScreen()',\n  'visibilitychange'\n]) {\n"""
          if old not in s: raise SystemExit('Static-Passkey-Anker fehlt')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/browser-smoke.mjs'); s=p.read_text(encoding='utf-8')
          old="""    out.securityMenu = menuText.includes('Passkey einrichten') && menuText.includes('App sperren');\n\n    // Hauptseiten müssen ohne Ausnahme umschaltbar sein.\n"""
          new="""    out.securityMenu = menuText.includes('Passkey einrichten') && menuText.includes('App sperren');\n    out.passkeyAutoApi = typeof window.pkMaybeAutoUnlock === 'function';\n\n    // Hauptseiten müssen ohne Ausnahme umschaltbar sein.\n"""
          if old not in s: raise SystemExit('Browser-Passkey-Anker fehlt')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if "var KA_V = '2026-11-01-u';" not in s: raise SystemExit('App-Version u fehlt')
          p.write_text(s.replace("var KA_V = '2026-11-01-u';","var KA_V = '2026-11-01-v';",1),encoding='utf-8')
          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          if "var V='2026-11-01-u'" not in s: raise SystemExit('SW-Version u fehlt')
          p.write_text(s.replace("var V='2026-11-01-u'","var V='2026-11-01-v'",1),encoding='utf-8')
          PY
      - name: Static regression checks
        run: npm run test:static
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dialoge.js tests/static-check.mjs tests/browser-smoke.mjs index.html sw.js
          git commit -m 'Passkey beim Öffnen der Sperrmaske automatisch starten'
          git push
