name: Fix passkey menu sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-passkey-menu-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sicherheitsmenü synchron an fillNavMenu binden
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('dialoge.js'); s=p.read_text(encoding='utf-8')
          anchor="""  function lockUiInit() {\n"""
          block="""  function pkPatchNavMenu() {\n    if (typeof window.fillNavMenu !== 'function' || window.fillNavMenu._kaSecurity) return;\n    var orig = window.fillNavMenu;\n    var wrapped = function () {\n      var r = orig.apply(this, arguments);\n      addLockMenuItem();\n      return r;\n    };\n    wrapped._kaSecurity = true;\n    window.fillNavMenu = wrapped;\n  }\n\n  function lockUiInit() {\n"""
          if anchor not in s: raise SystemExit('lockUiInit-Anker fehlt')
          s=s.replace(anchor,block,1)
          old="""      pkPatchPasswordChange(); pkRefreshUnlockButton(); pkWatchLockScreen();\n"""
          new="""      pkPatchPasswordChange(); pkPatchNavMenu(); pkRefreshUnlockButton(); pkWatchLockScreen();\n"""
          if old not in s: raise SystemExit('lockUiInit-Aufruf fehlt')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/static-check.mjs'); s=p.read_text(encoding='utf-8')
          old="""  'function pkWatchLockScreen()',\n  'visibilitychange'\n"""
          new="""  'function pkWatchLockScreen()',\n  'function pkPatchNavMenu()',\n  'visibilitychange'\n"""
          if old not in s: raise SystemExit('Static-Test-Anker fehlt')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if "var KA_V = '2026-11-01-v';" not in s: raise SystemExit('App-Version v fehlt')
          p.write_text(s.replace("var KA_V = '2026-11-01-v';","var KA_V = '2026-11-01-w';",1),encoding='utf-8')
          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          if "var V='2026-11-01-v'" not in s: raise SystemExit('SW-Version v fehlt')
          p.write_text(s.replace("var V='2026-11-01-v'","var V='2026-11-01-w'",1),encoding='utf-8')
          PY
      - name: Static regression checks
        run: npm run test:static
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dialoge.js tests/static-check.mjs index.html sw.js
          git commit -m 'Sicherheitsbereich synchron mit Praxis-Menü aufbauen'
          git push
