name: Fix passkey boot hook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-passkey-boot-hook.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Passkey und Sicherheitsmenü an App-Boot binden
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('dialoge.js'); s=p.read_text(encoding='utf-8')
          anchor="""  function pkPatchNavMenu() {\n"""
          block="""  function pkPatchBoot() {\n    if (typeof window.kaBoot !== 'function' || window.kaBoot._kaPasskeyBoot) return;\n    var orig = window.kaBoot;\n    var wrapped = function () {\n      var r = orig.apply(this, arguments);\n      pkPatchNavMenu();\n      watchSecurityMenu();\n      pkRefreshUnlockButton();\n      pkMaybeAutoUnlock();\n      return r;\n    };\n    wrapped._kaPasskeyBoot = true;\n    window.kaBoot = wrapped;\n  }\n\n  function pkPatchNavMenu() {\n"""
          if anchor not in s: raise SystemExit('pkPatchNavMenu-Anker fehlt')
          s=s.replace(anchor,block,1)

          old="""      pkPatchPasswordChange(); pkPatchNavMenu(); pkRefreshUnlockButton(); pkWatchLockScreen();\n"""
          new="""      pkPatchPasswordChange(); pkPatchBoot(); pkPatchNavMenu(); pkRefreshUnlockButton(); pkWatchLockScreen();\n"""
          if old not in s: raise SystemExit('lockUiInit-Aufruf fehlt')
          s=s.replace(old,new,1)

          old="""  function watchSecurityMenu() {\n    var box = document.getElementById('nav-menu');\n    if (!box) return;\n    addLockMenuItem();\n    if (!box._kaSecurityObserver && window.MutationObserver) {\n      var ob = new MutationObserver(function () {\n        if (!box.querySelector('[data-ka-security-root]')) setTimeout(addLockMenuItem, 0);\n      });\n      ob.observe(box, { childList: true });\n      box._kaSecurityObserver = ob;\n    }\n  }\n"""
          new="""  function watchSecurityMenu() {\n    var ensure = function () {\n      var box = document.getElementById('nav-menu');\n      if (!box) return false;\n      addLockMenuItem();\n      if (!box._kaSecurityObserver && window.MutationObserver) {\n        var ob = new MutationObserver(function () {\n          if (!box.querySelector('[data-ka-security-root]')) addLockMenuItem();\n        });\n        ob.observe(box, { childList: true });\n        box._kaSecurityObserver = ob;\n      }\n      return true;\n    };\n    if (ensure()) return;\n    if (!document.documentElement._kaSecurityHostObserver && window.MutationObserver) {\n      var hostOb = new MutationObserver(function () {\n        if (ensure()) { hostOb.disconnect(); document.documentElement._kaSecurityHostObserver = null; }\n      });\n      hostOb.observe(document.documentElement, { childList: true, subtree: true });\n      document.documentElement._kaSecurityHostObserver = hostOb;\n    }\n  }\n"""
          if old not in s: raise SystemExit('watchSecurityMenu-Anker fehlt')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/static-check.mjs'); s=p.read_text(encoding='utf-8')
          old="""  'function pkPatchNavMenu()',\n  'visibilitychange'\n"""
          new="""  'function pkPatchNavMenu()',\n  'function pkPatchBoot()',\n  '_kaSecurityHostObserver',\n  'visibilitychange'\n"""
          if old not in s: raise SystemExit('Static-Test-Anker fehlt')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/browser-smoke.mjs'); s=p.read_text(encoding='utf-8')
          old="""    fillNavMenu();\n    await new Promise(resolve => setTimeout(resolve, 0));\n"""
          new="""    fillNavMenu();\n    await new Promise(resolve => setTimeout(resolve, 20));\n"""
          if old not in s: raise SystemExit('Browser-Menü-Warteanker fehlt')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if "var KA_V = '2026-11-01-w';" not in s: raise SystemExit('App-Version w fehlt')
          p.write_text(s.replace("var KA_V = '2026-11-01-w';","var KA_V = '2026-11-01-x';",1),encoding='utf-8')
          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          if "var V='2026-11-01-w'" not in s: raise SystemExit('SW-Version w fehlt')
          p.write_text(s.replace("var V='2026-11-01-w'","var V='2026-11-01-x'",1),encoding='utf-8')
          PY
      - name: Static regression checks
        run: npm run test:static
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dialoge.js tests/static-check.mjs tests/browser-smoke.mjs index.html sw.js
          git commit -m 'Passkey-Start deterministisch an App-Boot binden'
          git push
