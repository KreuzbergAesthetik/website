name: Bump security UI version

# einmaliger Lauf
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-security-ui.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: PWA version bump
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="var KA_V = '2026-11-01-r';"; new="var KA_V = '2026-11-01-s';"
          if old not in s: raise SystemExit('App-Version r nicht gefunden')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          old="var V='2026-11-01-r'"; new="var V='2026-11-01-s'"
          if old not in s: raise SystemExit('SW-Version r nicht gefunden')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Static regression checks
        run: npm run test:static
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'PWA Version für neues Sperrmenü aktualisieren'
          git push
