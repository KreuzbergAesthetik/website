name: Implement Wiedervorstellung

on:
  push:
    branches:
      - feature/wiedervorstellung-fehlt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wiedervorstellung-fehlt
      - name: Wiedervorstellung implementieren
        run: python scripts/patch_wiedervorstellung.py
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wiedervorstellung als fälligen Hinweis ergänzen"
          git push origin HEAD:feature/wiedervorstellung-fehlt
