name: Apply navigation reorganisation v2

on:
  push:
    branches: [main]
    paths:
      - '.nav-reorg-trigger-v2'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source
        run: |
          test "$(git hash-object index.html)" = "9335cd9355947bf6a31ad586554607d68fa772be"
          test "$(git hash-object sw.js)" = "226bd576795c2e6b369afd231b2320a32bb6fefd"
      - name: Apply navigation patch
        run: python scripts/apply_nav_reorg.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n;\n'.join(blocks))
          PY
          node --check /tmp/index-inline.js
          node --check dialoge.js
          node --check docs.js
          node --check sync.js
          node --check extcal.js
          git diff --check
      - name: Commit navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Navigation nach Arbeitsablauf neu ordnen"
          git push
