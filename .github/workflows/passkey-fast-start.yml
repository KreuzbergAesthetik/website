name: Passkey fast start

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/passkey-fast-start.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Passkey sofort im frühen Sicherheitsblock starten
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('dialoge.js'); s=p.read_text(encoding='utf-8')
          old="""    pkAutoAttempted = true; pkAutoBusy = true;\n    setTimeout(function () {\n      Promise.resolve(window.pkUnlock ? window.pkUnlock() : pkUnlock()).catch(function () {}).finally(function () { pkAutoBusy = false; });\n    }, 60);\n"""
          new="""    pkAutoAttempted = true; pkAutoBusy = true;\n    Promise.resolve(window.pkUnlock ? window.pkUnlock() : pkUnlock()).catch(function () {}).finally(function () { pkAutoBusy = false; });\n"""
          if old not in s: raise SystemExit('Passkey-Timer-Anker fehlt')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="""function alPut(c) { try { if (c) localStorage.setItem(AL_KEY, JSON.stringify(c)); else localStorage.removeItem(AL_KEY); } catch (e) { alert('Speichern nicht möglich.'); } }\n"""
          new=old+"""/* Passkey schon während des frühen Sicherheitsstarts anfordern, nicht erst nach Aufbau der gesamten App. */\ntry { if (window.pkMaybeAutoUnlock) window.pkMaybeAutoUnlock(); } catch (x) {}\n"""
          if old not in s: raise SystemExit('alPut-Anker fehlt')
          s=s.replace(old,new,1)
          if "var KA_V = '2026-11-01-x';" not in s: raise SystemExit('App-Version x fehlt')
          s=s.replace("var KA_V = '2026-11-01-x';","var KA_V = '2026-11-01-y';",1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/static-check.mjs'); s=p.read_text(encoding='utf-8')
          anchor="""assert.ok(html.includes('id=\"al-pw\"'), 'Passwort-Fallback darf nicht entfernt werden');\n"""
          add=anchor+"""const earlyPk = html.indexOf('if (window.pkMaybeAutoUnlock) window.pkMaybeAutoUnlock()');\nconst mainBlock = html.indexOf('<script type=\"text/plain\" id=\"ka-main\">');\nassert.ok(earlyPk >= 0 && mainBlock >= 0 && earlyPk < mainBlock, 'Passkey muss vor dem großen App-Hauptblock gestartet werden');\nassert.ok(!dialogs.includes('}, 60);'), 'Passkey-Autostart darf keinen künstlichen 60-ms-Timer mehr haben');\n"""
          if anchor not in s: raise SystemExit('Static-Passkey-Anker fehlt')
          s=s.replace(anchor,add,1)
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          if "var V='2026-11-01-x'" not in s: raise SystemExit('SW-Version x fehlt')
          p.write_text(s.replace("var V='2026-11-01-x'","var V='2026-11-01-y'",1),encoding='utf-8')
          PY
      - name: Static regression checks
        run: npm run test:static
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dialoge.js index.html tests/static-check.mjs sw.js
          git commit -m 'Passkey-Abfrage beim App-Start beschleunigen'
          git push
