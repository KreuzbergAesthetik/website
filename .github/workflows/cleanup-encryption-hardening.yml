name: Cleanup encryption migration

on:
  push:
    branches: [main]
    paths:
      - '.github/encryption-hardening-cleanup-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-off migration files
        run: |
          rm -f .github/workflows/apply-encryption-hardening.yml
          rm -f .github/encryption-hardening-trigger
          rm -f .github/encryption-hardening-cleanup-trigger
          rm -f tools/apply-encryption-hardening.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Einmalige Verschlüsselungsmigration aufräumen"
          git push
