<!-- MODAL: RECHNUNG ERSTELLEN -->
<div id="modal-inv" class="modal-overlay">
  <div class="modal-box" style="max-width:680px;">
    <div class="modal-header"><strong id="inv-title">Rechnung erstellen</strong><button type="button" class="close-btn" onclick="closeModal('modal-inv')">&times;</button></div>
    <section class="inv-form-card"><h3>Allgemeine Angaben</h3>
    <div class="form-group inv-document-type"><label for="inv-document-kind">Dokument</label><select id="inv-document-kind" class="form-control" onchange="invDocumentChanged(this.value)"><option value="rechnung">Rechnung</option><option value="kv">Kostenvoranschlag (KV)</option></select></div>
    <div class="grid-2">
      <div class="form-group"><label>Patient *</label><input type="text" id="inv-patient" class="form-control" list="t-patient-list" placeholder="Name eingeben..." autocomplete="off" onchange="invPatientChanged()"></div>
      <div class="form-group"><label>Termin übernehmen</label><select id="inv-termin" class="form-control" onchange="invTerminChanged()"></select></div>
    </div>
    <div class="grid-2 inv-address-row">
      <div class="form-group"><label>Anschrift *</label><textarea id="inv-adresse" class="form-control dk-grow" rows="1" placeholder="Straße Hausnummer, PLZ Ort" oninput="autoGrow(this)"></textarea></div>
      <div class="form-group"><label>Rechnungsdatum *</label><input type="date" id="inv-datum" class="form-control"></div>
    </div>
    </section>
    <input type="date" id="inv-leistung" style="display:none">
    <section class="inv-form-card"><h3>Text vor der Tabelle</h3>
    <div class="dk-sec dk-fold closed" id="iv-f-vor"><button type="button" class="dk-h dk-fh" aria-expanded="false" onclick="ivFold(this)">Text vor der Tabelle</button><textarea id="inv-vortext" class="form-control dk-grow" rows="1" oninput="autoGrow(this)" placeholder="z.B. Vielen Dank für Ihr Vertrauen. Hiermit berechne ich Ihnen folgende Leistungen:"></textarea></div>
    </section>
    <section class="inv-form-card"><h3>Leistungen und Beträge</h3>
    <div class="ak-h">Positionen (Preise brutto in Euro)</div>
    <div id="inv-pos"></div>
    <div class="inv-addbar"><div class="dk-lwrap"><input type="text" id="inv-add" class="form-control" placeholder="Leistung hinzufügen: eintippen oder wählen" autocomplete="off" aria-label="Leistung hinzufügen"><div class="dk-dd" id="inv-add-dd"></div></div></div>
    <div id="inv-0info" style="display:none; font-size:12px; margin:6px 0; padding:8px 10px; border-radius:8px; background:#fef3c7; color:#92400e;"></div>
    <div class="inv-total-row"><div id="inv-rab"></div><div class="inv-total-value">Gesamt: <span id="inv-total">€ 0,00</span></div></div>
    </section>
    <section class="inv-form-card"><h3>Zahlung</h3>
    <div class="ak-h" id="inv-payh">Zahlung</div>
    <div class="seg" id="inv-payseg" role="group" aria-label="Zahlung">
      <button type="button" data-art="" class="on" onclick="setInvPay('')">Noch offen</button>
      <button type="button" data-art="Karte" onclick="setInvPay('Karte')">Karte</button>
      <button type="button" data-art="Bar" onclick="setInvPay('Bar')">Bar</button>
      <button type="button" data-art="Überweisung" onclick="setInvPay('Überweisung')">Überweisung</button>
      <button type="button" data-art="PayPal" onclick="setInvPay('PayPal')">PayPal</button>
    </div>
    <div id="inv-paybox" class="grid-2" style="display:none; margin-top:10px;">
      <div class="form-group"><label>Betrag in Euro</label><input type="text" id="inv-paybetrag" class="form-control" inputmode="decimal" oninput="invPayAuto = false"></div>
      <div class="form-group"><label>Zahlungsdatum</label><input type="date" id="inv-paydatum" class="form-control"></div>
    </div>
    </section>
    <section class="inv-form-card"><h3>Hinweise auf der Rechnung</h3>
    <div id="iv-zahlwrap">
      <div class="ak-h">Auf der Rechnung zeigen</div>
      <div class="dk-vgrid"><label class="tm-chk" style="display:flex; gap:8px; align-items:center; margin:0;"><input type="checkbox" id="inv-show-hint" checked> Zahlungshinweis</label><label class="tm-chk" style="display:flex; gap:8px; align-items:center; margin:0;"><input type="checkbox" id="inv-show-qr" checked> QR-Codes und Kontodaten</label></div>
      <div class="dk-sec dk-fold closed" id="iv-f-zahl"><div class="dk-h dk-fh" onclick="ivFold(this)">Text des Zahlungshinweises</div><textarea id="inv-zahlung" class="form-control dk-grow" rows="1" oninput="autoGrow(this)"></textarea></div>
    </div>
    </section>
    <section class="inv-form-card"><h3>Text zur Behandlung</h3>
    <div class="dk-sec dk-fold closed" id="iv-f-doku"><button type="button" class="dk-h dk-fh" aria-expanded="false" onclick="ivFold(this)">Text zur Behandlung (wird gedruckt)</button><textarea id="inv-doku" class="form-control dk-grow" rows="1" oninput="autoGrow(this)"></textarea><button type="button" id="inv-doku-btn" class="btn btn-secondary btn-sm" style="display:none; margin-top:6px;" onclick="invDokuEinfuegen()">Text aus der Dokumentation einfügen</button></div>
    </section>
    <div class="foot-bar"><button type="button" class="btn btn-cancel" onclick="closeModal('modal-inv')">Abbrechen</button><button type="button" class="btn btn-save" onclick="saveInvoice()" id="inv-savebtn">Rechnung erstellen</button></div>
  </div>
</div>
