<!-- MODAL: ZAHLUNG -->
<div id="modal-pay" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><strong id="pay-title">Zahlung erfassen</strong><button type="button" class="close-btn" onclick="closeModal('modal-pay')">&times;</button></div>
    <div class="form-group"><label>Zahlart</label>
      <select id="pay-art" class="form-control"><option>Karte</option><option>Bar</option><option>Überweisung</option><option>PayPal</option><option>Gutschein</option></select>
    </div>
    <div class="grid-2">
      <div class="form-group"><label>Betrag in Euro</label><input type="text" id="pay-betrag" inputmode="decimal" class="form-control"></div>
      <div class="form-group"><label>Datum</label><input type="date" id="pay-datum" class="form-control"></div>
    </div>
    <div class="foot-bar"><button type="button" id="pay-del" class="btn btn-del btn-ico" style="display:none" title="Zahlung löschen" aria-label="Zahlung löschen" onclick="deletePay()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button><button type="button" class="btn btn-cancel" onclick="closeModal('modal-pay')">Abbrechen</button><button type="button" class="btn btn-save" onclick="savePay()">Speichern</button></div>
  </div>
</div>
