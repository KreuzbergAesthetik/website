<!-- MODAL: DOKUMENTATION ZU TERMIN -->
<div id="modal-dkp" class="modal-overlay">
  <div class="modal-box" style="max-width:480px;">
    <div class="modal-header"><strong id="dkp-title">Dokumentation zu einem Termin</strong><button type="button" class="close-btn" onclick="closeModal('modal-dkp')">&times;</button></div>
    <div class="form-group"><label>Termin</label><select id="dkp-sel" class="form-control"></select></div>
    <div id="dkp-info" style="font-size:12px; color:#64748b;"></div>
    <div class="foot-bar"><button type="button" class="btn btn-cancel" onclick="closeModal('modal-dkp')">Abbrechen</button><button type="button" class="btn btn-save" id="dkp-go" onclick="dkpGo()">Weiter</button></div>
  </div>
</div>
