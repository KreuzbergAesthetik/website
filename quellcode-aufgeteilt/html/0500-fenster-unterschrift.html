<!-- MODAL: UNTERSCHRIFT -->
<div id="modal-sign" class="modal-overlay">
  <div class="modal-box" style="max-width:760px;">
    <div class="modal-header"><strong>Unterschrift</strong><button type="button" class="close-btn" onclick="closeModal('modal-sign')">&times;</button></div>
    <div id="sg-info" style="font-size:14px; color:#334155; margin-bottom:8px;"></div>
    <div style="border:2px dashed #94a3b8; border-radius:10px; background:#fff;"><canvas id="sg-cv" width="1400" height="400" style="width:100%; display:block; touch-action:none; cursor:crosshair;"></canvas></div>
    <div style="font-size:12px; color:#64748b; margin-top:6px;">Bitte mit Finger oder Stift im Feld unterschreiben.</div>
    <div class="foot-bar">
      <button type="button" class="btn btn-cancel" onclick="closeModal('modal-sign')">Abbrechen</button>
      <button type="button" class="btn btn-secondary" onclick="sgClear()">Leeren</button>
      <button type="button" class="btn btn-save" id="sg-ok" onclick="applySign()">Unterschrift übernehmen</button>
    </div>
  </div>
</div>
