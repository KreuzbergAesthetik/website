<!-- MODAL: LEISTUNG -->
<div id="modal-leist" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><strong id="ls-title">Neue Leistung</strong><button type="button" class="close-btn" onclick="closeModal('modal-leist')">&times;</button></div>
    <div class="form-group"><label>Bezeichnung *</label><input type="text" id="ls-name" class="form-control" autocomplete="off"></div>
    <div class="grid-2">
      <div class="form-group"><label>Preis brutto in Euro *</label><input type="text" id="ls-price" class="form-control" inputmode="decimal" oninput="lsFaktorInfo()"></div>
      <div class="form-group"><label>MwSt</label><select id="ls-rate" class="form-control" onchange="lsFaktorInfo()"><option value="19">19 %</option><option value="7">7 %</option><option value="0">0 %</option></select></div>
    </div>
    <div class="grid-2"><div class="form-group"><label>Gruppe (bestimmt die Farbe im Kalender)</label><select id="ls-kat" class="form-control"></select></div><div class="form-group"><label>Dauer in Minuten</label><input type="text" id="ls-dauer" class="form-control" inputmode="numeric" placeholder="z.B. 30"></div></div>
    <details class="settings-section" id="ls-goae-box"><summary>GOÄ (optional)</summary><div class="settings-content">
      <div class="form-group"><label>GOÄ-Positionen dieser Behandlung</label><div id="ls-goae-list"></div>
        <div style="display:flex; gap:6px; margin-top:6px;"><select id="ls-goae-pick" class="form-control" style="min-width:0;" onchange="lsGoaePick(this.value)"></select><button type="button" class="btn btn-secondary btn-sm" style="white-space:nowrap;" onclick="lsGoaeAdd('')">+ Eigene</button></div>
        <div id="ls-goae-hint" style="font-size:12px; color:#64748b; margin-top:4px;"></div></div>
      <div class="grid-2">
        <div class="form-group"><label>Präparat (Auslage § 10 GOÄ)</label><input type="text" id="ls-ausl-text" class="form-control" autocomplete="off" placeholder="Bezeichnung"></div>
        <div class="form-group"><label>Präparatkosten netto in Euro</label><input type="text" id="ls-ausl" class="form-control" inputmode="decimal" oninput="lsFaktorInfo()"></div>
      </div>
      <div class="form-group"><label>Begründung des Faktors (optional)</label><input type="text" id="ls-begr" class="form-control" autocomplete="off" placeholder="z. B. Zeitaufwand für Beratung, Behandlung und Betreuung"></div>
      <div id="ls-faktor" style="font-size:12.5px; margin-top:4px;"></div>
    </div></details>
    <div class="form-group"><label>Zugehörige Aufklärungen und Vorlagen</label><div id="ls-vorl"></div></div>
    <a href="#" id="ls-cp" style="display:none; font-size:13px; font-weight:600; color:#1e3a8a; text-decoration:none;" onclick="event.preventDefault(); var i = lsIdx; closeModal('modal-leist'); lsCopy(i);">Diese Leistung kopieren</a>
    <div class="foot-bar">
      <button type="button" id="ls-del" class="btn btn-del btn-ico" title="Löschen" aria-label="Löschen" style="display:none;" onclick="deleteLeist()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      <button type="button" class="btn btn-cancel" onclick="closeModal('modal-leist')">Abbrechen</button>
      <button type="button" class="btn btn-save" onclick="saveLeist()">Speichern</button>
    </div>
  </div>
</div>
