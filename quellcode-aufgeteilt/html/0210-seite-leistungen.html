  <!-- TAB: LEISTUNGEN -->
  <div id="tab-leistungen" class="tab-content">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Leistungen</span>
        <div class="row-actions">
          <button type="button" class="btn btn-secondary btn-sm" onclick="lsExport()">Exportieren</button>
          <button type="button" class="btn btn-sm" onclick="openLeist(-1)">+ Leistung</button>
        </div>
      </div>
      <div class="cal-bar" style="margin-bottom:10px;">
        <input type="text" id="ls-filter" class="form-control" placeholder="Leistungsname..." autocomplete="off" oninput="lsPage = 1; renderLeist()" style="flex:1 1 200px;">
        <select id="ls-fkat" class="form-control" style="width:auto; max-width:240px;" onchange="lsPage = 1; renderLeist()" aria-label="Gruppe"></select>
      </div>
      <div class="scroll">
        <table class="pt" style="min-width:640px; font-size:14px;">
          <thead><tr><th style="width:52px; cursor:pointer;" onclick="lsSortBy('id')">ID</th><th style="cursor:pointer;" onclick="lsSortBy('name')">Leistung</th><th style="width:150px; cursor:pointer;" onclick="lsSortBy('kat')">Gruppe</th><th style="width:100px; cursor:pointer;" onclick="lsSortBy('price')">Preis</th><th style="width:64px;">MwSt</th><th style="width:76px; cursor:pointer;" onclick="lsSortBy('dauer')">Dauer</th></tr></thead>
          <tbody id="ls-table"></tbody>
        </table>
      </div>
      <div id="ls-empty" style="color:#94a3b8; font-size:13px; padding:10px 0;">Noch keine Leistungen angelegt</div>
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px;">
        <select id="ls-per" class="form-control" style="width:auto;" onchange="lsPage = 1; renderLeist()" aria-label="Pro Seite"><option value="10">10 / Seite</option><option value="25" selected>25 / Seite</option><option value="50">50 / Seite</option><option value="0">Alle</option></select>
        <div id="ls-pager" class="seg"></div>
      </div>
      <div style="font-size:12px; color:#94a3b8; margin-top:8px;">Diese Leistungen erscheinen im Termin und in der Rechnung. Wählst Du dort eine Leistung, füllen sich Preis und Dauer automatisch.</div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div id="lk-box" style="margin-bottom:14px;"></div>
      <div id="rab-box"></div>
    </div>
  </div>
