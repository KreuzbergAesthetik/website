  <!-- TAB 2: PATIENTEN -->
  <div id="tab-patienten" class="tab-content">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Patienten</span>
        <button type="button" class="btn btn-sm btn-secondary" style="margin-left:auto" onclick="mgOpen()" title="Doppelte Akten finden und zusammenlegen" aria-label="Doppelte Akten zusammenlegen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5.5" r="2.2"/><circle cx="6" cy="18.5" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M6 7.7v8.6M8.2 5.5c5.5 0 9.8 1.5 9.8 4.3"/></svg></button>
        <button type="button" class="btn btn-sm btn-secondary" onclick="var l=document.getElementById('pt-leg'); l.style.display = l.style.display === 'none' ? 'flex' : 'none';" title="Legende der Punkte" aria-label="Legende der Punkte">ⓘ</button>
        <button type="button" class="btn btn-sm" onclick="openModal('modal-patient')" title="Neuer Patient" aria-label="Neuer Patient"><svg class="np-ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M19 8v6M16 11h6"/></svg><span class="np-t">+ Patient</span></button>
      </div>
      <input type="text" id="p-filter" class="form-control" placeholder="Name, Telefon, Geburtsdatum, #ID..." autocomplete="off" oninput="renderPatients()" style="display:none;">
      <div class="pt-leg" id="pt-leg" style="display:none"><span><i style="background:#ef4444"></i>To-Do</span><span><i style="background:#3b82f6"></i>Rechnung offen</span><span><i style="background:#06b6d4"></i>Anamnese</span><span><i style="background:#f97316"></i>Erinnerung fällig</span><span><i style="background:#22c55e"></i>Termin gebucht</span><span><i style="background:#eab308"></i>Rechnung nicht versendet</span></div>
      <div id="pt-er-row" style="display:flex; justify-content:flex-end; margin-bottom:4px;"><button type="button" class="btn btn-sm btn-secondary" id="pt-er-btn" onclick="ptToggleEr()" title="Spalte „Erstellt am“ ein- oder ausblenden" aria-label="Erstellt am ein- oder ausblenden"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button></div>
      <div class="scroll">
        <table class="pt">
          <thead><tr>
            <th class="sort" style="width:64px;" onclick="sortBy('id')">ID <span class="sarr" data-k="id"></span></th>
            <th class="sort" onclick="sortBy('name')"><div class="pt-hg"><span>Name <span class="sarr" data-k="name"></span></span><span class="pt-hb" onclick="event.stopPropagation(); sortBy('dob')" title="Nach Geburtsdatum sortieren">Geburtsdatum <span class="sarr" data-k="dob"></span></span><span class="pt-hh" onclick="event.stopPropagation()">Hinweise</span><span class="pt-hz"><span class="pt-hi" onclick="event.stopPropagation()">Informationen</span><span class="pt-ha" onclick="event.stopPropagation()"><button type="button" class="pt-erb" onclick="event.stopPropagation(); ptToggleEr()" title="Spalte „Erstellt am“ ein- oder ausblenden" aria-label="Erstellt am ein- oder ausblenden"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button></span></span></div></th>
            <th class="sort pc-er" style="width:190px;" onclick="sortBy('erstellt')">Erstellt am <span class="sarr" data-k="erstellt"></span></th>
          </tr></thead>
          <tbody id="patient-table"></tbody>
        </table>
      </div>
      <div class="row-actions" style="justify-content:center; margin-top:14px;">
        <button type="button" class="btn btn-secondary btn-sm" id="pt-abrufen" style="display:none" onclick="KS.abrufen()" title="Neue Formulare aus dem Postfach holen">Abrufen</button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('pimp-file').click()" title="Patienten, Rechnungen oder ausgefüllte Formulare einlesen">Import</button>
        <input type="file" id="pimp-file" multiple style="display:none" onchange="importPatienten(this)">
      </div>
    </div>
  </div>
