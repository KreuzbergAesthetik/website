<!-- MODAL: ANREDE -->
<div id="modal-an" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><strong id="an-title">Anrede</strong><button type="button" class="close-btn" onclick="closeModal('modal-an')">&times;</button></div>
    <div class="form-group"><label>Bei Frau</label><input type="text" id="an-0" class="form-control" autocomplete="off"></div>
    <div class="form-group"><label>Bei Herr</label><input type="text" id="an-1" class="form-control" autocomplete="off"></div>
    <div class="form-group"><label>Sonst (Divers oder ohne Angabe)</label><input type="text" id="an-2" class="form-control" autocomplete="off"></div>
    <div style="font-size:12px; color:#64748b; margin-bottom:8px;">Erlaubt sind {Vorname}, {Nachname} und {Name}.</div>
    <div class="foot-bar">
      <button type="button" class="btn btn-secondary" onclick="resetAn()">Zurücksetzen</button>
      <button type="button" class="btn btn-cancel" onclick="closeModal('modal-an')">Abbrechen</button>
      <button type="button" class="btn btn-save" onclick="saveAn()">Speichern</button>
    </div>
  </div>
</div>
