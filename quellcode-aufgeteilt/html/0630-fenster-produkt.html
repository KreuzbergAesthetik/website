<!-- MODAL: PRODUKT -->
<div id="modal-produkt" class="modal-overlay">
  <div class="modal-box" style="max-width:600px;">
    <div class="modal-header"><strong id="lp-title">Neues Produkt</strong><button type="button" class="close-btn" onclick="closeModal('modal-produkt')">&times;</button></div>
    <div class="form-group"><label>Bezeichnung</label><input type="text" id="lp-name" class="form-control" autocomplete="off"></div>
    <div class="grid-2">
      <div class="form-group"><label>Brutto (Verkaufspreis)</label><div style="display:flex;"><input type="text" id="lp-brutto" class="form-control" inputmode="decimal" oninput="lpPreview()" style="border-radius:8px 0 0 8px;"><span style="padding:0 12px; background:#f1f5f9; border:1px solid #cbd5e1; border-left:none; border-radius:0 8px 8px 0; display:flex; align-items:center; color:#475569;">€</span></div></div>
      <div class="form-group"><label>Steuer</label><select id="lp-steuer" class="form-control" onchange="lpPreview()"><option value="19">19 %</option><option value="7">7 %</option><option value="0">0 %</option></select></div>
    </div>
    <div class="form-group"><label>Produktgruppe</label><input type="text" id="lp-gruppe" class="form-control" list="lp-gruppen" autocomplete="off" placeholder="z.B. Hyaluron Filler"><datalist id="lp-gruppen"></datalist></div>
    <div class="ak-h">Vorschau</div>
    <table class="pt" style="font-size:14px; min-width:0;"><thead><tr><th>Produkt</th><th>Netto</th><th>MwSt</th><th>Brutto</th></tr></thead><tbody><tr><td id="lpv-name">-</td><td id="lpv-n">-</td><td id="lpv-m">-</td><td id="lpv-b">-</td></tr></tbody></table>
    <div class="grid-2" style="margin-top:12px;">
      <div class="form-group"><label>Einheit</label><input type="text" id="lp-einheit" class="form-control" list="lp-einheiten" autocomplete="off"><datalist id="lp-einheiten"><option value="Stück"><option value="Stk"><option value="ml"><option value="Vial"><option value="Spritze"><option value="Einheiten"></datalist></div>
      <div class="form-group"><label>Einkaufspreis (netto)</label><div style="display:flex;"><input type="text" id="lp-ek" class="form-control" inputmode="decimal" style="border-radius:8px 0 0 8px;"><span style="padding:0 12px; background:#f1f5f9; border:1px solid #cbd5e1; border-left:none; border-radius:0 8px 8px 0; display:flex; align-items:center; color:#475569;">€</span></div></div>
    </div>
    <div class="form-group"><label>Barcode</label><input type="text" id="lp-barcode" class="form-control" autocomplete="off"><div style="font-size:12px; color:#64748b; margin-top:3px;">Der Barcode dient der Zuordnung, zum Beispiel beim Scannen im Lager.</div></div>
    <div class="form-group"><label>Produkttext</label><textarea id="lp-text" class="form-control" rows="3"></textarea><div style="font-size:12px; color:#64748b; margin-top:3px;">Falls angegeben, steht dieser Text auf der Rechnung beim Produkt.</div></div>
    <div class="form-group"><label>Buchhaltungs-Konto</label><input type="text" id="lp-konto" class="form-control" autocomplete="off"></div>
    <div id="lp-stock" style="display:none;">
      <div class="ak-h">Lagerstand</div>
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
        <div id="lp-stand" style="font-size:30px; font-weight:700;"></div>
        <div style="display:flex; gap:6px;"><button type="button" class="btn btn-secondary" onclick="lpEinbuchen()">+ Produkt einbuchen</button><button type="button" class="btn btn-secondary" onclick="lpAusbuchen()">– Ausbuchen</button></div>
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group"><label>Minimaler Lagerbestand</label><input type="text" id="lp-min" class="form-control" inputmode="decimal"></div>
      <div class="form-group"><label>Lieferant</label><input type="text" id="lp-lief" class="form-control" autocomplete="off"></div>
    </div>
    <label class="tm-chk" style="display:flex; gap:8px; align-items:center; font-weight:400; margin-bottom:8px;"><input type="checkbox" id="lp-verw" checked> Lagerstand verwalten</label>
    <div id="lp-chbox" style="display:none;">
      <div style="font-weight:700; font-size:13px; margin:6px 0;">Chargen im Bestand</div>
      <div id="lp-chargen"></div>
    </div>
    <div id="lp-histbox" style="display:none;">
      <div class="ak-h">Buchungen</div>
      <div class="scroll"><table class="pt" style="font-size:13.5px; min-width:420px;"><thead><tr><th>Datum</th><th>Grund</th><th>Anzahl</th><th>EK netto</th></tr></thead><tbody id="lp-hist"></tbody></table></div>
      <button type="button" class="btn btn-secondary btn-sm" id="lp-histmore" style="margin-top:8px; display:none;" onclick="lpHistN += 10; lpHistory()">Mehr anzeigen</button>
    </div>
    <div class="foot-bar">
      <button type="button" id="lp-del" class="btn btn-del btn-ico" title="Löschen" aria-label="Löschen" style="display:none;" onclick="deleteProdukt()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      <button type="button" class="btn btn-cancel" onclick="closeModal('modal-produkt')">Abbrechen</button>
      <button type="button" class="btn btn-save" onclick="saveProdukt()">Speichern</button>
    </div>
  </div>
</div>
