<!-- MODAL: LEISTUNGSKATEGORIE -->
<div id="modal-rab" class="modal-overlay">
  <div class="modal-box" style="max-width:420px;">
    <div class="modal-header"><strong id="rb-title">Rabatt</strong><button type="button" class="close-btn" onclick="closeModal('modal-rab')">&times;</button></div>
    <div class="form-group"><label>Bezeichnung (steht auf der Rechnung)</label><input type="text" id="rb-name" class="form-control" autocomplete="off" placeholder="z. B. Erstkunde"></div>
    <div class="form-group"><label>Rabatt in Prozent</label><input type="text" id="rb-pct" class="form-control" inputmode="decimal" placeholder="20"></div>
    <div class="foot-bar">
      <button type="button" id="rb-del" class="btn btn-del btn-ico" title="Löschen" aria-label="Löschen" style="display:none;" onclick="deleteRab()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      <button type="button" class="btn btn-cancel" onclick="closeModal('modal-rab')">Abbrechen</button>
      <button type="button" class="btn btn-save" onclick="saveRab()">Speichern</button>
    </div>
  </div>
</div>

<div id="modal-lkat" class="modal-overlay">
  <div class="modal-box" style="max-width:420px;">
    <div class="modal-header"><strong id="lk-title">Kategorie</strong><button type="button" class="close-btn" onclick="closeModal('modal-lkat')">&times;</button></div>
    <div class="form-group"><label>Name</label><input type="text" id="lk-name" class="form-control" autocomplete="off"></div>
    <div class="form-group"><label>Farbe im Kalender</label><input type="color" id="lk-color" value="#2563eb" style="width:100%; height:42px; border:none; padding:0; border-radius:6px; cursor:pointer;"></div>
    <div class="foot-bar">
      <button type="button" id="lk-del" class="btn btn-del btn-ico" title="Löschen" aria-label="Löschen" style="display:none;" onclick="deleteLKat()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      <button type="button" class="btn btn-cancel" onclick="closeModal('modal-lkat')">Abbrechen</button>
      <button type="button" class="btn btn-save" onclick="saveLKat()">Speichern</button>
    </div>
  </div>
</div>
