<!-- MODAL: PATIENTENAKTE -->
<div id="modal-akte" class="akte-page">
  <div class="a-sidecol">
  <div class="a-top">
    <button type="button" class="btn btn-secondary icon-btn" title="Zurück" aria-label="Zurück" onclick="closeModal('modal-akte')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div id="a-title" class="a-title"></div>
    <button type="button" id="a-edit" class="a-pen" title="Stammdaten bearbeiten" aria-label="Stammdaten bearbeiten" onclick="toggleStamm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
  </div>
  <div id="a-flagcard" class="card a-flagcard" style="display:none;"></div>
  <div class="card a-side">
    <input type="file" id="a-img-in" accept="image/*" multiple style="position:fixed; left:-9999px; top:0; width:1px; height:1px; opacity:0;" onchange="addImages(this)">
    <input type="file" id="a-doc-in" multiple style="position:fixed; left:-9999px; top:0; width:1px; height:1px; opacity:0;" onchange="addDocs(this,'dokumente')">
    <input type="file" id="a-tpl-in" multiple style="position:fixed; left:-9999px; top:0; width:1px; height:1px; opacity:0;" onchange="addDocs(this,'templates')">
    <div id="a-head"></div>
  </div>
  </div>
  <div class="a-tabs">
    <button type="button" id="atb-akte" class="on" onclick="setAkTab('akte')">Akte</button>
    <button type="button" id="atb-anl" onclick="setAkTab('anl')">Anlagen</button>
    <button type="button" id="atb-fin" onclick="setAkTab('fin')">Finanzen</button>
  </div>

  <div class="a-pane">
  <div id="at-akte">
  <div class="card">
    <div class="ak-h" style="margin-top:0;display:flex;align-items:center;justify-content:space-between;">Zeitleiste<span id="a-audit-filter"></span></div>
    <div id="a-dok-pick" class="pick-box" style="display:none;">
      <div class="pick-h">Datei hinzufügen</div>
      <button type="button" class="btn btn-secondary" style="width:100%;" onclick="zuNext = null; document.getElementById('a-doc-in').click()">Datei aus dem Gerät wählen</button>
      <div style="font-size:12px; font-weight:700; color:#475569; margin:12px 0 6px;">Aus Vorlage</div>
      <div id="a-tpl-list"></div>
      <div class="foot-bar" style="margin-top:14px; padding-top:12px;">
        <button type="button" class="btn btn-secondary" onclick="dokPick=false;renderPick()">Schließen</button>
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('a-tpl-in').click()">+ Vorlage hochladen</button>
      </div>
    </div>
    <div id="a-verlauf"></div>
  </div>
  </div>
  <div id="at-anl" style="display:none;">
  <div id="a-unt-block" class="card" style="display:none;">
    <div class="card-header" style="margin-bottom:12px;"><div class="ak-h" style="margin:0; border:none; padding:0;">Unterlagen</div><button type="button" class="ak-act ak-grey" onclick="document.getElementById('akt-form-file').click()" title="Ausgefülltes Formular (PDF) einlesen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span>Import</span></button><input type="file" id="akt-form-file" multiple accept=".pdf,.json,application/pdf" style="display:none" onchange="importPatienten(this)"></div>
    <div id="a-unt"></div>
  </div>

  <div id="a-medien-block" class="card">
    <div class="card-header" style="margin-bottom:6px;">
      <div class="ak-h" style="margin:0; border:none; padding:0;">Bilder und Dateien</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button type="button" id="md-addf" class="ak-act ak-datei" onclick="zuNext = null; document.getElementById('a-img-in').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg><span>Foto</span></button>
        <button type="button" id="md-addd" class="ak-act ak-datei" onclick="zuNext = null; document.getElementById('a-doc-in').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M12 12v5M9.5 14.5h5"/></svg><span>Datei</span></button>
      </div>
    </div>
    <div class="cal-bar">
      <input type="text" id="md-filter" class="form-control" placeholder="Dateiname suchen..." autocomplete="off" oninput="medLimit = 30; renderMedien()" style="flex:1 1 200px;">
    </div>
    <div class="seg md-seg" id="md-seg"><button type="button" id="md-bild" onclick="setMedFilter('bild')"></button><button type="button" id="md-dok" onclick="setMedFilter('dok')"></button></div>
    <div id="md-chips" class="md-chips"></div>
    <div id="md-list"></div>
  </div>
  </div>
  <div id="at-fin" style="display:none;">
  <div id="a-fin-block" class="card">
    <div class="card-header" style="margin-bottom:6px;"><div class="ak-h" style="margin:0; border:none; padding:0;">Finanzen</div><button type="button" class="ak-act ak-rec" onclick="openInvoice(curP)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 7a7 7 0 100 10M5 10h9M5 14h9"/></svg><span>Rechnung</span></button></div>
    <div id="a-fin"></div>
  </div>
  </div>
  </div>
  <button type="button" class="btn btn-secondary" style="margin-bottom:20px;" onclick="closeModal('modal-akte')">&lsaquo; Zurück</button>
</div>
