<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Terminerinnerung Kreuzberg Ästhetik</title>
<link rel="stylesheet" href="forms.css">
</head>
<body data-form="erinnerung">
<div class="top"><img src="icon-192.png" alt="Kreuzberg Ästhetik"></div>
<div class="wrap" id="formbox">
  <form id="f" novalidate autocomplete="on">
    <div class="fhead"><h1>Terminerinnerung</h1><button type="button" class="info-i" data-for="info" onclick="toggleInfo(this)" title="Hinweise zum Formular" aria-label="Hinweise zum Formular">i</button></div>
    <div class="info-panel" id="info"><p>Wenn Du möchtest, erinnern wir Dich per E-Mail an Deine Termine. Das ist freiwillig. Pflichtfelder sind mit einem <span style="color:#dc2626">*</span> markiert.</p></div>

    <h2>Zur Person</h2>
    <div class="card">
      <div class="grid2">
        <div><label class="l">Vorname <span class="req">*</span></label><input type="text" id="vorname" autocomplete="given-name"></div>
        <div><label class="l">Nachname <span class="req">*</span></label><input type="text" id="nachname" autocomplete="family-name"></div>
      </div>
      <label class="l">Geburtsdatum <span class="req">*</span></label>
      <div class="grid3" id="g-dob">
        <input type="text" id="dob-t" inputmode="numeric" maxlength="2" placeholder="Tag" aria-label="Tag" autocomplete="bday-day">
        <select id="dob-m" aria-label="Monat" autocomplete="bday-month"><option value="">Monat</option><option value="01">Januar</option><option value="02">Februar</option><option value="03">März</option><option value="04">April</option><option value="05">Mai</option><option value="06">Juni</option><option value="07">Juli</option><option value="08">August</option><option value="09">September</option><option value="10">Oktober</option><option value="11">November</option><option value="12">Dezember</option></select>
        <input type="text" id="dob-j" inputmode="numeric" maxlength="4" placeholder="Jahr" aria-label="Jahr" autocomplete="bday-year">
      </div>
    </div>

    <h2>Einwilligung</h2>
    <div class="card">
      <label class="l">E-Mail-Adresse <span class="req">*</span></label>
      <input type="email" id="email" autocomplete="email">
      <label class="l" style="margin-top:16px">Ich erkläre mich damit einverstanden, dass die Praxis meine Daten (Name, Geburtsdatum, E-Mail-Adresse, Termindaten) verarbeitet, um mir Terminerinnerungen per E-Mail zu senden. Die Einwilligung ist freiwillig und kann jederzeit mit Wirkung für die Zukunft widerrufen werden. <span class="req">*</span></label>
      <div class="radios" id="g-einw">
        <label><input type="radio" name="einw" value="ja"> ja</label>
        <label><input type="radio" name="einw" value="nein"> nein</label>
      </div>
      <div id="datenschutz"></div>
    </div>

    <div id="extras"></div>

    <h2>Unterschrift</h2>
    <div class="card">
      <canvas id="sig" class="sigbox"></canvas>
      <div class="sigbar"><span>Bitte mit dem Finger oder der Maus unterschreiben <span class="req" style="color:#dc2626">*</span></span><button type="button" class="btn" id="sig-clear" style="padding:6px 14px;font-size:14px">Löschen</button></div>
    </div>

    <div class="hp"><label>Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>
    <div id="errmsg" class="msg err" style="display:none"></div>
    <div class="actions">
      <button type="reset" class="btn" id="reset">Zurücksetzen</button>
      <button type="submit" class="btn primary" id="go">Absenden</button>
    </div>
  </form>
</div>
<script src="forms.js"></script>
<script src="ftexte.js"></script>
<script>
$('datenschutz').appendChild(datenschutzBlock());
var sig = makeSig($('sig'));
$('sig-clear').onclick = function () { sig.clear(); };
$('f').addEventListener('reset', function (ev) { if (!confirm('Alle Eingaben löschen?')) { ev.preventDefault(); return; } sig.clear(); });

var EX = null;
KF.ready(function () { KF.apply(); EX = KF.extras($('extras')); });
function val(id) { return $(id).value.trim(); }
function collect() {
  document.querySelectorAll('.invalid').forEach(function (n) { n.classList.remove('invalid'); });
  var bad = [], d = {};
  d.vorname = val('vorname'); if (!d.vorname) bad.push($('vorname'));
  d.nachname = val('nachname'); if (!d.nachname) bad.push($('nachname'));
  d.dob = dobFromParts(val('dob-t'), $('dob-m').value, val('dob-j')); if (!d.dob) bad.push($('g-dob'));
  d.email = val('email'); if (!isEmail(d.email)) bad.push($('email'));
  d.einwilligung = (document.querySelector('input[name=einw]:checked') || {}).value || ''; if (!d.einwilligung) bad.push($('g-einw'));
  var ex = EX ? EX.collect() : { bad: [], list: [] }; bad = bad.concat(ex.bad); d.extra = ex.list;
  if (sig.isEmpty()) bad.push($('sig'));
  return { d: d, bad: bad };
}

async function buildErinnerung(d) {
  var who = d.vorname + ' ' + d.nachname;
  var P = await newPdf(KF.name('Einwilligung Terminerinnerung'), d.nachname + ', ' + d.vorname + ' (geb. ' + d.dob + ')');
  function kv(k, v) {
    var lines = P.wrap(v || '-', P.f, 10.5, P.W - P.M * 2 - 180), lh = 14; P.ensure(lh * lines.length + 4);
    P.page.drawText(k, { x: P.M, y: P.y - 10, size: 9.5, font: P.f, color: P.gray });
    lines.forEach(function (l, i) { P.page.drawText(l, { x: P.M + 180, y: P.y - 10 - i * lh, size: 10.5, font: P.f, color: P.black }); });
    P.y -= lh * lines.length + 4;
  }
  P.text('PERSÖNLICHE ANGABEN', { size: 10.5, bold: true, gap: 2 }); P.rule(8);
  kv('Name', who); kv('Geburtsdatum', d.dob); kv('E-Mail', d.email);
  P.y -= 8; P.text('EINWILLIGUNG', { size: 10.5, bold: true, gap: 2 }); P.rule(8);
  kv('Terminerinnerung per E-Mail', d.einwilligung === 'ja' ? 'Ja, ich bin mit der Verarbeitung meiner Daten zum Versand von Terminerinnerungen per E-Mail einverstanden. Ich kann diese Einwilligung jederzeit mit Wirkung für die Zukunft widerrufen.' : 'Nein, ich wünsche keine Terminerinnerung.');
  KF.pdf(P, d.extra);
  P.y -= 6; P.text('Mit meiner Unterschrift bestätige ich die Richtigkeit meiner Angaben und habe die Datenschutzhinweise zur Kenntnis genommen.', { size: 9, italic: true, color: P.gray, gap: 8 });
  await P.sign(sig.png(), 'Unterschrift', who);
  return await P.finish({ format: 'ka-formular', version: 1, typ: 'erinnerung', erstellt: new Date().toISOString(), patient: { vorname: d.vorname, nachname: d.nachname, dob: d.dob, email: d.email }, einwilligung: d.einwilligung, extra: d.extra });
}

$('f').addEventListener('submit', async function (ev) {
  ev.preventDefault(); $('errmsg').style.display = 'none';
  var r = collect();
  if (r.bad.length) { r.bad.forEach(function (n) { if (n.classList) n.classList.add('invalid'); }); r.bad[0].scrollIntoView({ behavior: 'smooth', block: 'center' }); errBox('Bitte fülle alle mit * markierten Felder aus (rot umrandet).'); return; }
  var go = $('go'); go.disabled = true; go.textContent = 'Wird erstellt …';
  try {
    var d = r.d, data = { format: 'ka-formular', version: 1, typ: 'erinnerung', erstellt: new Date().toISOString(), patient: { vorname: d.vorname, nachname: d.nachname, dob: d.dob, email: d.email }, einwilligung: d.einwilligung, extra: d.extra };
    var pdf = await buildErinnerung(d);
    await deliver('erinnerung', 'Terminerinnerung', d.nachname + '_' + d.vorname, data, pdf, $('website').value);
    showDone('Formular');
  } catch (x) { go.disabled = false; go.textContent = 'Absenden'; errBox(x && x.message ? x.message : 'Das hat leider nicht geklappt. Bitte versuche es noch einmal.'); }
});
</script>
</body>
</html>
